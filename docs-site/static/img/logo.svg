<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#61dafb"/>
      <stop offset="100%" stop-color="#2196f3"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="128" cy="128" r="120" fill="#1a1a2e" opacity="0.08"/>
  <!-- React orbits -->
  <ellipse cx="128" cy="128" rx="95" ry="36" stroke="url(#glow)" stroke-width="2.5" fill="none" transform="rotate(-30 128 128)" opacity="0.6"/>
  <ellipse cx="128" cy="128" rx="95" ry="36" stroke="url(#glow)" stroke-width="2.5" fill="none" transform="rotate(30 128 128)" opacity="0.6"/>
  <ellipse cx="128" cy="128" rx="95" ry="36" stroke="url(#glow)" stroke-width="2.5" fill="none" transform="rotate(90 128 128)" opacity="0.6"/>
  <!-- Core -->
  <circle cx="128" cy="128" r="14" fill="url(#glow)"/>
  <!-- Form lines inside -->
  <rect x="104" y="115" width="48" height="4" rx="2" fill="#fff" opacity="0.95"/>
  <rect x="104" y="125" width="48" height="4" rx="2" fill="#fff" opacity="0.75"/>
  <rect x="104" y="135" width="32" height="4" rx="2" fill="#fff" opacity="0.55"/>
  <!-- Orbit electrons -->
  <circle cx="223" cy="128" r="6" fill="url(#glow)"/>
  <circle cx="68" cy="68" r="5" fill="url(#glow)" opacity="0.8"/>
  <circle cx="188" cy="188" r="5" fill="url(#glow)" opacity="0.8"/>
</svg>
